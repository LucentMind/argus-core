appId: com.argus.core
productName: Argus
directories:
  buildResources: build
# Ad-hoc signs the macOS bundle after packing, but only for credential-less builds (no
# CSC_LINK / CSC_NAME). Without a signature the DMG reads as "damaged" on Apple Silicon.
# When signing credentials are present the hook stands down and electron-builder's real
# Developer ID signing takes over. See build/afterPack.cjs for the full rationale.
afterPack: build/afterPack.cjs
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  # Native binaries cannot be spawned from inside an asar (Electron virtualizes asar paths
  # for fs but not for CreateProcess/exec). Both bundled agent CLIs shipped broken because of
  # this. electron-builder auto-detects and unpacks executables, which is how they worked at
  # all, but relying on that detection is implicit — a dependency shipping a binary in a shape
  # it does not recognize would silently regress. Unpack node_modules explicitly instead.
  #
  # Scoped to the two binary-bearing packages rather than a blanket '**/node_modules/**',
  # which would inflate the installer and forfeit the asar for everything else. The tradeoff
  # is that each new provider needs a line here; `npm run smoke:packaged` is the backstop that
  # catches a forgotten one. If we grow past a handful of providers, switch to the blanket
  # pattern (as t3code does) and stop maintaining this list by hand.
  - '**/node_modules/@github/copilot-*/**'
  - '**/node_modules/@anthropic-ai/claude-agent-sdk-*/**'
extraResources:
  # Core-shipped internal packs (declarative only — no domain binaries baked in).
  # Loaded read-only from <resources>/packs.seed, distinct from the writable ARGUS_HOME/packs.
  - from: ../packs
    to: packs.seed
    filter:
      - '**/*'
      - '!**/bin-src/**'
      - '!**/node_modules/**'
  - from: resources/onboarding-sample
    to: onboarding-sample
    filter:
      - '**/*'
  - from: resources/core-skills
    to: core-skills
    filter:
      - '**/*'
win:
  executableName: argus
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # Release builds are Developer-ID-signed and notarized. The certificate, its password and the
  # notarization credentials all come from the environment, never from this file — see the
  # "Configure macOS signing and notarization" step in .github/workflows/build.yml.
  #
  # `identity` is deliberately NOT pinned here. electron-builder discovers the identity from
  # whatever CSC_LINK imports (or from the local login keychain), so a contributor without the
  # cert still gets a working ad-hoc-signed build instead of a hard "identity is not valid"
  # failure. Do NOT set `identity: null`: that disables signing entirely, leaving the bundle
  # with only the linker's stub sig and no _CodeSignature/CodeResources — which macOS reports
  # as "damaged, move to Trash" on a quarantined download.
  #
  # hardenedRuntime is electron-builder's non-MAS default, but notarization is rejected
  # outright without it, so it is stated explicitly rather than inherited.
  hardenedRuntime: true
  # Both keys are needed: `entitlements` covers the outer app, `entitlementsInherit` the
  # nested helpers. Setting only the latter silently left the app on electron-builder's
  # default plist, which lacks the JIT/unsigned-memory exceptions Electron needs.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  # Typed `boolean` in electron-builder 26 — it only gates the integration. The actual
  # credentials are read from APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER. With none
  # of those set, electron-builder logs "skipped macOS notarization" and carries on, so local
  # builds are unaffected.
  notarize: true
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
