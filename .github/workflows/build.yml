name: Build desktop binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact: windows
          - os: macos-latest
            script: build:mac
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      # Gated to the macOS leg on purpose: CSC_LINK is not a macOS-specific variable, so
      # exporting it job-wide would make electron-builder try to sign the Windows .exe with an
      # Apple certificate. Degrades gracefully — with no certificate secret the build still
      # succeeds with the ad-hoc signature from build/afterPack.cjs, just unnotarized.
      - name: Configure macOS signing and notarization
        if: matrix.os == 'macos-latest'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::warning::MACOS_CERTIFICATE is unset - building with an ad-hoc signature, not notarized."
            exit 0
          fi

          # electron-builder imports this into a temporary keychain of its own and derives the
          # signing identity from it, so no `security create-keychain` / intermediate-CA
          # download is needed. Apple's intermediates ship with the runner image.
          echo "CSC_LINK=$MACOS_CERTIFICATE" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$MACOS_CERTIFICATE_PWD" >> "$GITHUB_ENV"

          # @electron/notarize wants a filesystem PATH to the .p8, not the key contents:
          # it passes the value straight to `notarytool --key`. Written to RUNNER_TEMP rather
          # than the workspace so upload-artifact cannot sweep it into a release asset.
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          # Mind the name: electron-builder reads APPLE_API_ISSUER, without the _ID suffix.
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_ID" >> "$GITHUB_ENV"

      # `--publish never` keeps electron-builder from trying to push to the
      # `publish.generic` URL in electron-builder.yml. Releasing is the
      # release job's business, not the build's.
      - name: Build
        working-directory: app
        run: npm run ${{ matrix.script }} -- --publish never

      # Catches the class of bug the unit suite structurally cannot: a bundled CLI binary
      # that resolves inside app.asar and therefore cannot be spawned. There is no asar
      # until the app is packaged, so this only has teeth here. Asserts the binaries
      # LAUNCH, not that they authenticate — CI has no credentials, and "not
      # authenticated" is a healthy answer that proves the process ran.
      - name: Smoke-test packaged provider CLIs
        working-directory: app
        run: npm run smoke:packaged

      # electron-builder notarizes the .app only, and does it inside its signing phase — before
      # the DMG target is assembled. So the file users actually download ends up with no ticket
      # of its own, and macOS checks the DMG, since that is what carries the download quarantine
      # flag. The DMG needs no signature (electron-builder's `dmg.sign` defaults to false
      # because signing one interferes with notarization), only its own stapled ticket.
      - name: Notarize and staple the DMG
        if: matrix.os == 'macos-latest' && env.CSC_LINK != '' && env.APPLE_API_KEY != ''
        run: |
          set -euo pipefail
          DMG=$(ls app/dist/*.dmg)
          # `--wait` exits non-zero unless the status comes back Accepted.
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"

      # A build that quietly falls back to an ad-hoc signature looks identical in the log to a
      # correctly signed one until a user hits Gatekeeper. Assert the outcome instead. Only
      # enforced when a certificate was actually configured, so credential-less runs (forks,
      # or before the secrets exist) still pass.
      - name: Verify signature and notarization
        if: matrix.os == 'macos-latest' && env.CSC_LINK != ''
        env:
          # Checked against the bundle rather than hardcoded, so the signing team is not
          # recorded in this public repo. Secrets are masked, so it stays out of build logs too.
          EXPECTED_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="app/dist/mac-arm64/Argus.app"
          [ -d "$APP" ] || APP="app/dist/mac/Argus.app"
          DMG=$(ls app/dist/*.dmg)

          codesign --verify --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee /tmp/codesign.txt

          # A Developer ID authority (not an ad-hoc or Apple Development signature)...
          grep -q '^Authority=Developer ID Application:' /tmp/codesign.txt
          # ...belonging specifically to the expected team, so an unrelated valid cert cannot
          # silently take over releases. Skipped if the secret is absent rather than passing
          # vacuously on an empty grep pattern.
          if [ -n "${EXPECTED_TEAM_ID:-}" ]; then
            grep -q "^TeamIdentifier=${EXPECTED_TEAM_ID}$" /tmp/codesign.txt
          else
            echo "::warning::MACOS_TEAM_ID unset - team identity not asserted."
          fi
          grep -q 'Timestamp=' /tmp/codesign.txt

          # The real notarization gate, on both artifacts. stapler reads the ticket itself, so
          # unlike `spctl --assess` it cannot be fooled by a machine with Gatekeeper assessments
          # turned off — where spctl returns "accepted" even for ad-hoc signed code, making it
          # useless as a gate. Verified: `spctl --status` reporting "assessments disabled"
          # accepts a `codesign --sign -` binary with exit 0.
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"

          # Informational for that same reason: only trustworthy where assessments are enabled.
          if spctl --status 2>&1 | grep -q "assessments enabled"; then
            spctl --assess --type execute --verbose "$APP"
          else
            echo "::notice::Gatekeeper assessments disabled here; skipping spctl (stapler gated)."
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: argus-${{ matrix.artifact }}
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/*.blockmap
            app/dist/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Draft: assets land on the release page but nothing is public until
      # someone clicks Publish.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --draft \
            --generate-notes \
            --notes "$(cat <<'EOF'
          ### macOS install

          Open the `.dmg` and drag **Argus** to Applications, then launch it. The build is signed with an Apple Developer ID and notarized by Apple, so no Gatekeeper prompt or `xattr` workaround is needed.

          ---
          EOF
          )" \
            artifacts/*
