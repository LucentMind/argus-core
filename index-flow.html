  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ent\">Argus captures what they know.<\/span><\/div>\n        <\/sc-if>\n        <div style=\"font-size:17.5px; line-height:1.65; color:oklch(0.72 0.015 265); max-width:50ch\">Every triage session produces cited, verifiable findings — and distills the tribal knowledge behind them into skills your whole team runs. Automation that earns trust before it takes the wheel.<\/div>\n        <div style=\"display:flex; gap:12px; margin-top:6px\">\n          <a href=\"mailto:jiawiehan@gmail.com?subject=Argus%20demo\" data-book-demo=\"\" style=\"white-space:nowrap; background:linear-gradient(135deg, oklch(0.88 0.14 85), oklch(0.74 0.13 60)); color:#141414; font-weight:600; font-size:15px; padding:14px 26px; border-radius:10px; box-shadow:0 8px 28px oklch(0.7 0.13 70 / .35); cursor:pointer\">Book a demo<\/a>\n          <a href=\"https://github.com/LucentMind/argus-core\" target=\"_blank\" rel=\"noopener\" style=\"white-space:nowrap; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.03); font-size:14.5px; font-weight:500; padding:14px 22px; border-radius:10px; display:inline-flex; align-items:center; gap:9px; cursor:pointer\"><span style=\"color:oklch(0.85 0.15 85)\">★<\/span> Star on GitHub<\/a>\n        <\/div>\n        <div style=\"font-size:13px; color:oklch(0.55 0.015 265)\">Core is open source. Demos are for enterprise packs, pilots &amp; support.<\/div>\n      <\/div>\n      <!-- hero: animated finding demo -->\n      <div data-reveal=\"\" style=\"position:relative; transition-delay:.15s\">\n        <div style=\"position:absolute; inset:-32px; background:radial-gradient(closest-side, oklch(0.5 0.1 85 / .14), transparent); border-radius:50%\"><\/div>\n        <div style=\"position:relative; background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03)); border:1px solid rgba(255,255,255,.12); border-radius:18px; padding:26px; display:flex; flex-direction:column; gap:16px; backdrop-filter:blur(16px); box-shadow:0 24px 64px rgba(0,0,0,.45)\">\n          <div style=\"display:flex; justify-content:space-between; align-items:center; min-height:26px\">\n            <span style=\"font-size:13px; font-weight:500; color:oklch(0.7 0.015 265)\">Finding<\/span>\n            <span style=\"position:relative; display:inline-grid\">\n              <span style=\"grid-area:1/1; font-size:12px; font-weight:500; color:oklch(0.88 0.1 85); background:oklch(0.45 0.09 85 / .15); padding:5px 12px; border-radius:99px; display:inline-flex; align-items:center; gap:6px; animation:dStatus 14s infinite\"><span style=\"width:6px; height:6px; border-radius:50%; background:oklch(0.85 0.15 85)\"><\/span>Needs review<\/span>\n              <span style=\"grid-area:1/1; font-size:12px; font-weight:600; color:oklch(0.82 0.13 155); background:oklch(0.6 0.12 155 / .15); padding:5px 12px; border-radius:99px; display:inline-flex; align-items:center; justify-content:center; gap:6px; opacity:0; animation:dAccepted 14s infinite\">✓ Accepted<\/span>\n            <\/span>\n          <\/div>\n          <div style=\"font-size:16px; font-weight:500; line-height:1.55; letter-spacing:-0.01em\">Watchdog reset caused by CAN buffer overflow during OTA — regression introduced in v2.4.1<\/div>\n          <div style=\"display:flex; flex-direction:column; gap:8px\">\n            <span style=\"display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,.04); padding:10px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.07); animation:dChip 14s infinite\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px; color:oklch(0.85 0.015 265)\">trace_0712.dlt<span style=\"color:oklch(0.6 0.015 265)\">:48211<\/span><\/span><span style=\"font-size:12.5px; font-weight:500; color:oklch(0.75 0.09 235)\">Verify →<\/span><\/span>\n            <span style=\"display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,.04); padding:10px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px; color:oklch(0.85 0.015 265)\">can_driver.c<span style=\"color:oklch(0.6 0.015 265)\">:1042<\/span><\/span><span style=\"font-size:12.5px; font-weight:500; color:oklch(0.75 0.09 235)\">Verify →<\/span><\/span>\n          <\/div>\n          <!-- evidence peek -->\n          <div style=\"background:oklch(0.12 0.012 265); border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:12px 14px; font-family:'JetBrains Mono',monospace; font-size:11.5px; line-height:1.9; color:oklch(0.6 0.015 265); animation:dEvPeek 14s infinite\">\n            <div>48209&nbsp;&nbsp;[CAN] tx queue depth 254/256<\/div>\n            <div>48210&nbsp;&nbsp;[CAN] tx queue depth 256/256<\/div>\n            <div style=\"color:oklch(0.9 0.1 85); border-radius:4px; padding:0 4px; margin:0 -4px; animation:dEvLine 14s infinite\">48211&nbsp;&nbsp;[CAN] buffer overflow — frame dropped<\/div>\n            <div>48212&nbsp;&nbsp;[WDG] watchdog reset triggered<\/div>\n          <\/div>\n          <div style=\"display:flex; gap:10px; align-items:center; position:relative\">\n            <span style=\"flex:1.3; text-align:center; font-size:14px; font-weight:600; background:oklch(0.72 0.14 155); color:oklch(0.18 0.03 155); padding:11px; border-radius:10px; box-shadow:0 4px 16px oklch(0.65 0.13 155 / .3); animation:dAcceptBtn 14s infinite\">Accept<\/span>\n            <span style=\"flex:1; text-align:center; font-size:14px; font-weight:500; background:rgba(255,255,255,.07); padding:11px; border-radius:10px\">Edit<\/span>\n            <span style=\"flex:1; text-align:center; font-size:14px; font-weight:500; color:oklch(0.68 0.015 265); padding:11px; border-radius:10px\">Reject<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n    <!-- pilot logos -->\n    <sc-if value=\"{{ showPilotLogos }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"position:relative; display:flex; align-items:center; gap:28px; justify-content:center; padding:8px 40px 56px; font-size:12.5px; color:oklch(0.55 0.015 265); letter-spacing:.06em\">\n        <span style=\"font-family:'JetBrains Mono',monospace\">PILOTING WITH<\/span>\n        <span style=\"border:1px dashed rgba(255,255,255,.18); border-radius:6px; padding:7px 22px; color:oklch(0.6 0.015 265)\">logo<\/span>\n        <span style=\"border:1px dashed rgba(255,255,255,.18); border-radius:6px; padding:7px 22px; color:oklch(0.6 0.015 265)\">logo<\/span>\n        <span style=\"border:1px dashed rgba(255,255,255,.18); border-radius:6px; padding:7px 22px; color:oklch(0.6 0.015 265)\">logo<\/span>\n        <span style=\"font-family:'JetBrains Mono',monospace; color:oklch(0.45 0.015 265)\">[placeholder — pilot partners]<\/span>\n      <\/div>\n    <\/sc-if>\n  <\/div>\n\n  <!-- ================= PAIN ================= -->\n  <div id=\"problem\" data-section=\"problem\" style=\"max-width:1200px; margin:0 auto; padding:56px 40px; display:flex; flex-direction:column; gap:32px\">\n    <div data-reveal=\"\" style=\"display:flex; flex-direction:column; gap:16px; max-width:760px\">\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px; color:oklch(0.85 0.12 85); letter-spacing:.14em\">THE PROBLEM<\/div>\n      <div style=\"font-size:38px; line-height:1.15; font-weight:700; letter-spacing:-0.02em; text-wrap:pretty\">Defect triage is the biggest hidden time sink in your org — and the skill behind it is tribal.<\/div>\n    <\/div>\n    <div data-reveal=\"\" style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:16px\">\n      <div style=\"background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.09); border-radius:16px; padding:28px; display:flex; flex-direction:column; gap:12px\">\n        <span style=\"width:48px; height:48px; border-radius:12px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); display:inline-flex; align-items:center; justify-content:center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"oklch(0.88 0.015 265)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\/circle><polyline points=\"12 6 12 12 16 14\"><\/polyline><\/svg><\/span>\n        <div style=\"font-size:17px; font-weight:600\">Your seniors do it, so it's invisible<\/div>\n        <div style=\"font-size:14.5px; line-height:1.6; color:oklch(0.68 0.015 265)\">The engineers who triage fastest are the ones you can least afford to spend on it. The cost never shows up in a sprint — it shows up in everything that ships late.<\/div>\n      <\/div>\n      <div style=\"background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.09); border-radius:16px; padding:28px; display:flex; flex-direction:column; gap:12px\">\n        <span style=\"width:48px; height:48px; border-radius:12px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); display:inline-flex; align-items:center; justify-content:center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"oklch(0.88 0.015 265)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5\"><\/path><line x1=\"9\" y1=\"18\" x2=\"15\" y2=\"18\"><\/line><line x1=\"10\" y1=\"22\" x2=\"14\" y2=\"22\"><\/line><\/svg><\/span>\n        <div style=\"font-size:17px; font-weight:600\">The knowledge lives in heads<\/div>\n        <div style=\"font-size:14.5px; line-height:1.6; color:oklch(0.68 0.015 265)\">Which log pattern means what. Which release had which regression. Which investigation order wastes a day. None of it is written down — and it walks out the door with the person.<\/div>\n      <\/div>\n      <div style=\"background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.09); border-radius:16px; padding:28px; display:flex; flex-direction:column; gap:12px\">\n        <span style=\"width:48px; height:48px; border-radius:12px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); display:inline-flex; align-items:center; justify-content:center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"oklch(0.88 0.015 265)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 20h16a2 2 0 0 0 1.73-3z\"><\/path><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"><\/line><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"><\/line><\/svg><\/span>\n        <div style=\"font-size:17px; font-weight:600\">Full auto-triage burns trust<\/div>\n        <div style=\"font-size:14.5px; line-height:1.6; color:oklch(0.68 0.015 265)\">A confidently wrong AI analysis posted to a ticket sends it to the wrong team — and every wrong call makes engineers more resistant to AI triage. Trust, once burned, doesn't come back.<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- ================= DEMO: evidence → cited finding ================= -->\n  <div id=\"demo\" data-section=\"demo\" style=\"max-width:1200px; margin:0 auto; padding:44px 40px; display:flex; flex-direction:column; gap:26px\">\n    <div data-reveal=\"\" style=\"display:flex; flex-direction:column; gap:16px; max-width:760px\">\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px; color:oklch(0.85 0.12 85); letter-spacing:.14em\">THE DELIBERATE MIDDLE PATH<\/div>\n      <div style=\"font-size:38px; line-height:1.15; font-weight:700; letter-spacing:-0.02em; text-wrap:pretty\">Evidence in. Cited finding out. A human in between.<\/div>\n      <div style=\"font-size:16.5px; line-height:1.65; color:oklch(0.7 0.015 265)\">Engineers triage real cases in a workbench with an embedded agent. Every claim the agent makes carries a <span style=\"font-family:'JetBrains Mono',monospace; font-size:14.5px; color:oklch(0.87 0.13 85)\">[file:line]<\/span> citation — one click verifies it against the evidence. Findings are structured records the engineer accepts or edits, never chat scroll.<\/div>\n    <\/div>\n    <!-- animated workbench mock -->\n    <div data-reveal=\"\" style=\"position:relative; transition-delay:.1s\">\n      <div style=\"position:absolute; inset:-40px; background:radial-gradient(600px 300px at 50% 50%, oklch(0.35 0.06 265 / .35), transparent); pointer-events:none\"><\/div>\n      <div style=\"position:relative; background:oklch(0.17 0.015 265); border:1px solid rgba(255,255,255,.1); border-radius:18px; overflow:hidden; box-shadow:0 32px 80px rgba(0,0,0,.5)\">\n        <div style=\"display:flex; align-items:center; gap:8px; padding:14px 20px; border-bottom:1px solid rgba(255,255,255,.07)\">\n          <span style=\"width:11px; height:11px; border-radius:50%; background:rgba(255,255,255,.14)\"><\/span>\n          <span style=\"width:11px; height:11px; border-radius:50%; background:rgba(255,255,255,.14)\"><\/span>\n          <span style=\"width:11px; height:11px; border-radius:50%; background:rgba(255,255,255,.14)\"><\/span>\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:oklch(0.6 0.015 265); margin-left:12px\">case KAN-412 · watchdog reset after OTA<\/span>\n        <\/div>\n        <div style=\"display:grid; grid-template-columns:minmax(220px,300px) minmax(0,1.2fr) minmax(250px,340px)\">\n          <!-- evidence panel -->\n          <div style=\"border-right:1px solid rgba(255,255,255,.07); padding:16px; display:flex; flex-direction:column; gap:8px; position:relative; overflow:hidden\">\n            <div style=\"font-size:12px; font-weight:600; color:oklch(0.6 0.015 265); letter-spacing:.08em; margin-bottom:2px\">REPOS<\/div>\n            <div style=\"display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07); border-radius:10px; padding:9px 12px\">\n E FLYWHEEL<\/div>\n        <div style=\"font-size:38px; line-height:1.15; font-weight:700; letter-spacing:-0.02em; text-wrap:pretty\">Every solved defect makes the next one cheaper.<\/div>\n        <div style=\"font-size:16px; line-height:1.7; color:oklch(0.7 0.015 265)\">The agent distills each session into an <span style=\"color:#fff; font-weight:500\">inert skill proposal<\/span> — nothing activates until a human accepts it. Accepted skills ship to your team registry as ordinary pull requests: reviewed, versioned, installed pinned to a commit.<\/div>\n        <div style=\"font-size:16px; line-height:1.7; color:oklch(0.7 0.015 265)\">When a skill's acceptance rate earns it, it <span style=\"color:oklch(0.87 0.13 85); font-weight:500\">graduates<\/span>: matching tickets get pre-analyzed headlessly before anyone opens them. Novel cases keep routing to humans — the loop that built the trust keeps building it.<\/div>\n        <div style=\"display:flex; gap:22px; margin-top:8px\">\n          <div style=\"display:flex; flex-direction:column; gap:4px\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:600; color:#fff\">100%<\/span><span style=\"font-size:12.5px; color:oklch(0.6 0.015 265)\">of skills human-reviewed before activation<\/span><\/div>\n          <div style=\"width:1px; background:rgba(255,255,255,.1)\"><\/div>\n          <div style=\"display:flex; flex-direction:column; gap:4px\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:600; color:#fff\">PR-only<\/span><span style=\"font-size:12.5px; color:oklch(0.6 0.015 265)\">knowledge sharing — versioned &amp; pinned<\/span><\/div>\n        <\/div>\n      <\/div>\n      <!-- animated flywheel diagram -->\n      <div data-reveal=\"\" style=\"position:relative; height:520px; width:540px; flex:0 0 540px; transition-delay:.15s\">\n        <svg sc-camel-view-box=\"0 0 520 520\" style=\"position:absolute; top:0; left:50%; transform:translateX(-50%); widt div style=\"font-size:16px; line-height:1.7; color:oklch(0.7 0.015 265)\">Argus records cost, tokens, latency, and approvals locally — down to <span style=\"color:#fff; font-weight:500\">cost per resolved case<\/span>. Per-skill acceptance rates tell you, with data, which skills have earned the right to run unsupervised.<\/div>\n      <div style=\"font-size:16px; line-height:1.7; color:oklch(0.7 0.015 265)\">If Argus isn't paying for itself, the dashboard is where you'll find out first. We'd rather prove it than pitch it.<\/div>\n      <div style=\"display:inline-flex; align-self:flex-start; align-items:center; gap:8px; font-family:'JetBrains Mono',monospace; font-size:12px; color:oklch(0.55 0.015 265); border:1px dashed rgba(255,255,255,.18); border-radius:8px; padding:8px 14px\">[placeholder — pilot metrics land here]<\/div>\n    <\/div>\n    <!-- animated metrics panel -->\n    <div data-reveal=\"\" style=\"background:oklch(0.17 0.015 265); border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:28px; display:flex; flex-direction:column; gap:24px; box-shadow:0 24px 64px rgba(0,0,0,.4); transition-delay:.15s\">\n      <div style=\"display:flex; justify-content:space-between; align-items:center\">\n        <span style=\"font-size:13.5px; font-weight:600\">Observability<\/span>\n        <span style=\"display:inline-flex; align-items:center; gap:7px; font-size:11.5px; font-weight:500; color:oklch(0.82 0.13 155); background:oklch(0.6 0.12 155 / .12); padding:4px 11px; border-radius:99px\"><span style=\"width:6px; height:6px; border-radius:50%; background:oklch(0.75 0.14 155); animation:pulseDot 2s infinite\"><\/span>local · SQLite<\/span>\n      <\/div>\n      <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:12px\">\n        <div style=\"background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:16px\"><div style=\"font-size:11px; color:oklch(0.58 0.015 265); letter-spacing:.06em\">COST / RESOLVED CASE<\/div><div style=\"font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:600; margin-top:6px\">$4.12<\/div><div style=\"font-size:11px; color:oklch(0.75 0.13 155); margin-top:2px\">▼ 38% since w1<\/div><\/div>\n        <div style=\"background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:16px\"><div style=\"font-size:11px; color:oklch(0.58 0.015 265); letter-spacing:.06em\">SKILL ACCEPTANCE<\/div><div style=\"font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:600; margin-top:6px\">91%<\/div><div style=\"font-size:11px; color:oklch(0.6 0.015 265); margin-top:2px\">hive-log-triage · 34 runs<\/div><\/div>\n        <div style=\"background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:16px\"><div style=\"font-size:11px; color:oklch(0.58 0.015 265); letter-spacing:.06em\">GRADUATED SKILLS<\/div><div style=\"font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:600; margin-top:6px; color:oklch(0.88 0.12 85)\">3<\/div><div style=\"font-size:11px; color:oklch(0.6 0.015 265); margin-top:2px\">pre-analyzing headlessly<\/div><\/div>\n      <\/div>\n      <div style=\"display:flex; flex-direction:column; gap:10px\">\n        <div style=\"display:flex; justify-content:space-between; font-size:11px; color:oklch(0.58 0.015 265); letter-spacing:.06em\"><span>TIME TO FIRST CITED FINDING<\/span><span>8 WEEKS<\/span><\/div>\n        <div style=\"display:flex; align-items:flex-end; gap:8px; height:110px\">\n          <div style=\"flex:1; height:100%; background:linear-gradient(180deg, oklch(0.6 0.1 85 / .5), oklch(0.6 0.1 85 / .15)); border-radius:6px 6px 3px 3px; transform-origin:bottom; animation:barGrow .7s .1s cubic-bezier(.2,.8,.2,1) both\"><\/div>\n          <div style=\"flex:1; height:88%; background:linear-gradient(180deg, oklch(0.6 0.1 85 / .5), oklch(0.6 0.1 85 / .15)); border-radius:6px 6px 3px 3px; transform-origin:bottom; animation:barGrow .7s .2s cubic-bezier(.2,.8,.2,1) both\"><\/div>\n          <div style=\"flex:1; height:74%; background:linear-gradient(180deg, oklch(0.6 0.1 85 / .5), oklch(0.6 0.1 85 / .15)); border-radius:6px 6px 3px 3px; transform-origin:bottom; animation:barGrow .7s .3s cubic-bezier(.2,.8,.2,1) both\"><\/div>\n          <div style=\"flex:1; height:66%; background:linear-gradient(180deg, oklch(0.6 0.1 85 / .5), oklch(0.6 0.1 85 / .15)); border-radius:6px 6px 3px 3px; transform-origin:bottom; animation:barGrow .7s .4s cubic-bezier(.2,.8,.2,1) both\"><\/div>\n          <div style=\"flex:1; height:52%; background:linear-gradient(180deg, oklch(0.7 0.12 85 / .6), oklch(0.7 0.12 85 / .2)); border-radius:6px 6px 3px 3px; transform-origin:bottom; animation:barGrow .7s .5s cubic-bezier(.2,.8,.2,1) both\"><\/div>\n          <div style=\"flex:1; height:44%; background:linear-gradient(180deg, oklch(0.7 0.12 85 / .6), oklch(0.7 0.12 85 / .2)); border-radius:6px 6px 3px 3px; transform-origin:bottom; animation:barGrow .7s .6s cubic-bezier(.2,.8,.2,1) both\"><\/div>\n          <div style=\"flex:1; height:34%; background:linear-gradient(180deg, oklch(0.8 0.14 85 / .8), oklch(0.8 0.14 85 / .25)); border-radius:6px 6px 3px 3px; transform-origin:bottom; animation:barGrow .7s .7s cubic-bezier(.2,.8,.2,1) both\"><\/div>\n          <div style=\"flex:1; height:26%; background:linear-gradient(180deg, oklch(0.85 0.15 85), oklch(0.85 0.15 85 / .3)); border-radius:6px 6px 3px 3px; transform-origin:bottom; animation:barGrow .7s .8s cubic-bezier(.2,.8,.2,1) both\"><\/div>\n        <\/div>\n        <div style=\"font-size:11px; color:oklch(0.5 0.015 265)\">illustrative — replace with pilot data<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- ================= TRUST MODEL ================= -->\n  <div id=\"trust\" data-section=\"trust\" style=\"position:relative; border-top:1px solid rgba(255,255,255,.06); background:oklch(0.125 0.014 265)\">\n    <div style=\"max-width:1200px; margin:0 auto; padding:48px 40px; display:flex; flex-direction:column; gap:32px\">\n      <div data-reveal=\"\" style=\"display:flex; flex-direction:column; gap:16px; max-width:760px\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px; color:oklch(0.85 0.12 85); letter-spacing:.14em\">WHAT'S ACTUALLY NEW<\/div>\n        <div style=\"font-size:38px; line-height:1.15; font-weight:700; letter-spacing:-0.02em; text-wrap:pretty\">Plenty of tools bolt an agent onto triage. Argus makes it earn autonomy.<\/div>\n        <div style=\"font-size:16.5px; line-height:1.65; color:oklch(0.7 0.015 265)\">The hard problem in AI triage isn't analysis — it's trust. Three mechanisms you won't find in a chat sidebar:<\/div>\n      <\/div>\n      <div data-reveal=\"\" style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:16px\">\n        <div style=\"background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.09); border-radius:16px; padding:26px; display:flex; flex-direction:column; gap:10px\">\n          <span style=\"align-self:flex-start; font-size:11.5px; font-weight:600; letter-spacing:.08em; color:oklch(0.88 0.1 85); background:oklch(0.45 0.09 85 / .14); padding:4px 12px; border-radius:99px\">GRADUATED AUTONOMY<\/span>\n          <div style=\"font-size:15.5px; font-weight:600\">Automation earns scope like a junior engineer<\/div>\n          <div style=\"font-size:14px; line-height:1.6; color:oklch(0.68 0.015 265)\">Every review action is measured. A skill runs unsupervised only when its acceptance rate — real data from your team's reviews — says it's earned it. Novel cases keep routing to humans.<\/div>\n        <\/div>\n        <div style=\"background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.09); border-radius:16px; padding:26px; display:flex; flex-direction:column; gap:10px\">\n          <span style=\"align-self:flex-start; font-size:11.5px; font-weight:600; letter-spacing:.08em; color:oklch(0.8 0.13 155); background:oklch(0.6 0.12 155 / .12); padding:4px 12px; border-radius:99px\">KNOWLEDGE MOVES LIKE CODE<\/span>\n          <div style=\"font-size:15.5px; font-weight:600\">Skills are files, shared by pull request<\/div>\n          <div style=\"font-size:14px; line-height:1.6; color:oklch(0.68 0.015 265)\">No vector-DB slurp, no silent updates. Distilled skills and references are reviewed, versioned, and installed pinned to a commit — the same trust machinery your code already uses.<\/div>\n        <\/div>\n        <div style=\"background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.09); border-radius:16px; padding:26px; display:flex; flex-direction:column; gap:10px\">\n          <span style=\"align-self:flex-start; font-size:11.5px; font-weight:600; letter-spacing:.08em; color:oklch(0.78 0.09 235); background:oklch(0.55 0.12 245 / .14); padding:4px 12px; border-radius:99px\">CITATIONS, NOT VIBES<\/span>\n          <div style=\"font-size:15.5px; font-weight:600\">Unverifiable claims can't become findings<\/div>\n          <div style=\"font-size:14px; line-height:1.6; color:oklch(0.68 0.015 265)\">Every interpretive claim must anchor to <span style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px\">[file:line]<\/span> in the evidence. Trust isn't asked for — it's checkable, one click at a time.<\/div>\n        <\/div>\n      <\/div>\n      <div data-reveal=\"\" style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:16px\">\n        <div style=\"display:flex; gap:12px; align-items:flex-start\"><span style=\"color:oklch(0.85 0.13 85); font-size:15px\">✓<\/span><div style=\"font-size:13.5px; line-height:1.55; color:oklch(0.72 0.015 265)\"><span style=\"color:#fff; font-weight:600\">Local-first.<\/span> Evidence, findings, and metrics live on the engineer's machine.<\/div><\/div>\n        <div style=\"display:flex; gap:12px; align-items:flex-start\"><span style=\"color:oklch(0.85 0.13 85); font-size:15px\">✓<\/span><div style=\"font-size:13.5px; line-height:1.55; color:oklch(0.72 0.015 265)\"><span style=\"color:#fff; font-weight:600\">Skills are inert<\/span> until a human accepts them. No silent activation.<\/div><\/div>\n        <div style=\"display:flex; gap:12px; align-items:flex-start\"><span style=\"color:oklch(0.85 0.13 85); font-size:15px\">✓<\/span><div style=\"font-size:13.5px; line-height:1.55; color:oklch(0.72 0.015 265)\"><span style=\"color:#fff; font-weight:600\">Risk-gated tools.<\/span> Reads auto-run; writes stop at an editable preview; destructive ops confirm one by one.<\/div><\/div>\n        <div style=\"display:flex; gap:12px; align-items:flex-start\"><span style=\"color:oklch(0.85 0.13 85); font-size:15px\">✓<\/span><div style=\"font-size:13.5px; line-height:1.55; color:oklch(0.72 0.015 265)\"><span style=\"color:#fff; font-weight:600\">Honest limits.<\/span> Backend limitations are declared in the UI, not hidden.<\/div><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- ================= TECH DETAILS ================= -->\n  <sc-if value=\"{{ showTechDetails }}\" hint-placeholder-val=\"{{ true }}\">\n  <div id=\"tech\" data-section=\"tech\" style=\"max-width:1200px; margin:0 auto; padding:48px 40px; display:flex; flex-direction:column; gap:32px\">\n    <div data-reveal=\"\" style=\"display:flex; flex-direction:column; gap:16px; max-width:760px\">\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px; color:oklch(0.85 0.12 85); letter-spacing:.14em\">UNDER THE HOOD<\/div>\n      <div style=\"font-size:38px; line-height:1.15; font-weight:700; letter-spacing:-0.02em\">For the engineers evaluating this.<\/div>\n    <\/div>\n    <div data-reveal=\"\" style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:16px\">\n      <div style=\"background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:24px; display:flex; flex-direction:column; gap:8px\"><div style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:oklch(0.87 0.13 85)\">agent backends<\/div><div style=\"font-size:14px; line-height:1.6; color:oklch(0.7 0.015 265)\">Claude Agent SDK (default) or GitHub Copilot behind one driver abstraction — pick the model, it picks the provider. Copilot's free tier works.<\/div><\/div>\n      <div style=\"background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:24px; display:flex; flex-direction:column; gap:8px\"><div style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:oklch(0.87 0.13 85)\">domain-free core + packs<\/div><div style=\"font-size:14px; line-height:1.6; color:oklch(0.7 0.015 265)\">Core knows no file formats. Packs ship detectors, parsers, skills, reference docs, and sandboxed UI panels via an <span style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px\">argus-pack.json<\/span> manifest.<\/div><\/div>\n      <div style=\"background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:24px; display:flex; flex-direction:column; gap:8px\"><div style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:oklch(0.87 0.13 85)\">evidence engine<\/div><div style=\"font-size:14px; line-height:1.6; color:oklch(0.7 0.015 265)\">Auto-typed artifacts, binary extraction to searchable text, SQLite FTS5 across evidence, findings, and transcripts. No embeddings required.<\/div><\/div>\n      <div style=\"background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:24px; display:flex; flex-direction:column; gap:8px\"><div style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:oklch(0.87 0.13 85)\">code workspaces<\/div><div style=\"font-size:14px; line-height:1.6; color:oklch(0.7 0.015 265)\">Cases link checked-out repos; the agent gets sandboxed <span style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px\">git<\/span>/<span style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px\">gh<\/span> with worktree isolation.<\/div><\/div>\n      <div style=\"background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:24px; display:flex; flex-direction:column; gap:8px\"><div style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:oklch(0.87 0.13 85)\">observability<\/div><div style=\"font-size:14px; line-height:1.6; color:oklch(0.7 0.015 265)\">Local SQLite metrics; optional OpenTelemetry export to self-hosted Langfuse — off by default, one case per trace session.<\/div><\/div>\n      <div style=\"background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:24px; display:flex; flex-direction:column; gap:8px\"><div style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:oklch(0.87 0.13 85)\">stack<\/div><div style=\"font-size:14px; line-height:1.6; color:oklch(0.7 0.015 265)\">Electron · React 19 · TypeScript · Tailwind 4 · <span style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px\">node:sqlite<\/span>. Requires Node 22.13+ and one agent backend logged in.<\/div><\/div>\n    <\/div>\n  <\/div>\n  <\/sc-if>\n\n  <!-- ================= CTA ================= -->\n  <div id=\"cta\" data-section=\"cta\" style=\"position:relative; overflow:hidden\">\n    <div style=\"position:absolute; inset:0; background:radial-gradient(700px 340px at 50% 110%, oklch(0.45 0.09 85 / .18), transparent 70%)\"><\/div>\n    <div data-reveal=\"\" style=\"position:relative; max-width:1200px; margin:0 auto; padding:48px 40px; display:flex; flex-direction:column; align-items:center; gap:24px; text-align:center; margin-top:auto\">\n      <div style=\"font-size:42px; line-height:1.12; font-weight:700; letter-spacing:-0.025em; max-width:20ch; text-wrap:pretty\">Start capturing what your team already knows.<\/div>\n      <div style=\"font-size:16.5px; line-height:1.65; color:oklch(0.7 0.015 265); max-width:52ch\">Run the open-source core with your own Claude or Copilot login — or talk to us about enterprise packs, pilots, and support.<\/div>\n      <div style=\"display:flex; gap:12px; margin-top:8px\">\n        <a href=\"mailto:jiawiehan@gmail.com?subject=Argus%20demo\" data-book-demo=\"\" style=\"white-space:nowrap; background:linear-gradient(135deg, oklch(0.88 0.14 85), oklch(0.74 0.13 60)); color:#141414; font-weight:600; font-size:15px; padding:14px 28px; border-radius:10px; box-shadow:0 8px 28px oklch(0.7 0.13 70 / .35); cursor:pointer\">Book a demo<\/a>\n        <a href=\"https://github.com/LucentMind/argus-core\" target=\"_blank\" rel=\"noopener\" style=\"white-space:nowrap; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.03); font-size:14.5px; font-weight:500; padding:14px 24px; border-radius:10px; font-family:'JetBrains Mono',monospace; cursor:pointer\">$ git clone argus<\/a>\n      <\/div>\n    <\/div>\n    <div style=\"position:relative; border-top:1px solid rgba(255,255,255,.07); margin-top:auto; width:100%\">\n      <div style=\"max-width:1200px; margin:0 auto; padding:28px 40px; display:flex; justify-content:space-between; align-items:center; font-size:13px; color:oklch(0.55 0.015 265)\">\n        <div style=\"display:flex; align-items:center; gap:10px\"><img src=\"ca2b024c-4d34-4ccf-bb09-becdadc2c1f1\" alt=\"Argus\" style=\"width:22px; height:22px; border-radius:6px; display:block\"><span style=\"font-family:'Michroma',sans-serif; font-size:11px; letter-spacing:.22em; color:oklch(0.85 0.015 265)\">ARGUS<\/span><span>· local-first, human-in-the-loop triage<\/span><\/div>\n        <div style=\"display:flex; gap:22px\"><a href=\"#demo\">Product<\/a><a href=\"#trust\">Trust model<\/a><a href=\"https://github.com/LucentMind/argus-core\" target=\"_blank\" rel=\"noopener\">GitHub<\/a><a href=\"https://github.com/LucentMind/argus-core/blob/main/LICENSE\" target=\"_blank\" rel=\"noopener\">License<\/a><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;headlineVariant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pain&quot;,&quot;knowledge&quot;],&quot;default&quot;:&quot;knowledge&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Copy&quot;},&quot;showPilotLogos&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;showTechDetails&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  state = { active: \"hero\" };\n  componentDidMount() {\n    this._ro = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        if (e.isIntersecting) { e.target.setAttribute(\"data-reveal\", \"in\"); this._ro.unobserve(e.target); }\n      });\n    }, { threshold: 0.12, rootMargin: \"0px 0px -6% 0px\" });\n    document.querySelectorAll(\"[data-reveal]\").forEach((el) => this._ro.observe(el));\n    this._so = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        if (e.isIntersecting) this.setState({ active: e.target.getAttribute(\"data-section\") });\n      });\n    }, { rootMargin: \"-45% 0px -45% 0px\", threshold: 0 });\n    document.querySelectorAll(\"[data-section]\").forEach((el) => this._so.observe(el));\n    // zoom-safe absolute top: offsetTop chain (layout px) × body zoom\n    this._topOf = (el) => {\n      if (el === document.querySelector(\"[data-section]\")) return 0; // first section snaps to page top, header included\n      const z = parseFloat(getComputedStyle(document.body).zoom) || 1;\n      let t = 0, n = el;\n      while (n && n !== document.body) { t += n.offsetTop; n = n.offsetParent; }\n      return t * z;\n    };\n    // Snapping is native CSS scroll-snap (scroll-snap-type on html);\n    // no scroll listeners — JS-assisted snapping fights inertial scrolling.\n  }\n  componentWillUnmount() {\n    if (this._ro) this._ro.disconnect();\n    if (this._so) this._so.disconnect();\n  }\n  renderVals() {\n    const variant = this.props.headlineVariant ?? \"pain\";\n    const showTech = this.props.showTechDetails ?? true;\n    const sections = [\n      [\"hero\", \"Top\"], [\"problem\", \"The problem\"], [\"demo\", \"Product\"],\n      [\"flywheel\", \"Flywheel\"], [\"impact\", \"Impact\"], [\"trust\", \"What's new\"],\n      ...(showTech ? [[\"tech\", \"Under the hood\"]] : []), [\"cta\", \"Get started\"],\n    ];\n    const active = this.state.active;\n    return {\n      painHeadline: variant === \"pain\",\n      knowledgeHeadline: variant === \"knowledge\",\n      showPilotLogos: this.props.showPilotLogos ?? true,\n      showTechDetails: showTech,\n      dots: sections.map(([id, label]) => ({\n        label,\n        bg: active === id ? \"oklch(0.85 0.15 85)\" : \"rgba(255,255,255,.22)\",\n        glow: active === id ? \"0 0 12px oklch(0.8 0.14 85 / .6)\" : \"none\",\n        scale: active === id ? \"scale(1.25)\" : \"scale(1)\",\n        go: () => {\n          const el = document.querySelector(`[data-section=\"${id}\"]`);\n          if (!el) return;\n          window.scrollTo({ top: this._topOf(el), behavior: \"smooth\" });\n        },\n      })),\n    };\n  }\n}\n<\/script>\n\n\n<!-- ============ demo booking modal ============ -->\n<style>\n#bkModal { position:fixed; inset:0; z-index:120; display:none; align-items:center; justify-content:center; font-family:'Geist',sans-serif; }\n#bkModal.bk-open { display:flex; }\n#bkBackdrop { position:absolute; inset:0; background:oklch(0.08 0.012 265 / .72); backdrop-filter:blur(8px); }\n#bkPanel { position:relative; width:min(460px, calc(100vw - 32px)); max-height:calc(100svh - 48px); overflow-y:auto; background:oklch(0.17 0.015 265); border:1px solid rgba(255,255,255,.12); border-radius:18px; padding:30px; box-shadow:0 32px 90px rgba(0,0,0,.6); color:#fff; animation:bkIn .28s cubic-bezier(.2,.7,.2,1); }\n@keyframes bkIn { from { opacity:0; transform:translateY(14px) scale(.98); } to { opacity:1; transform:none; } }\n@media (prefers-reduced-motion: reduce) { #bkPanel { animation:none; } }\n#bkClose { position:absolute; top:14px; right:14px; width:32px; height:32px; border:none; border-radius:8px; background:rgba(255,255,255,.06); color:oklch(0.75 0.015 265); font-size:18px; line-height:1; cursor:pointer; }\n#bkClose:hover { background:rgba(255,255,255,.12); color:#fff; }\n#bkForm { display:flex; flex-direction:column; gap:14px; margin-top:22px; }\n#bkForm label { display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:500; color:oklch(0.78 0.015 265); }\n#bkForm input, #bkForm textarea { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:11px 13px; color:#fff; font-family:'Geist',sans-serif; font-size:14.5px; line-height:1.5; resize:vertical; }\n#bkForm input::placeholder, #bkForm textarea::placeholder { color:oklch(0.5 0.015 265); }\n#bkForm input:focus, #bkForm textarea:focus { outline:none; border-color:oklch(0.7 0.12 85); box-shadow:0 0 0 3px oklch(0.7 0.13 85 / .18); }\n#bkSubmit { margin-top:6px; border:none; background:linear-gradient(135deg, oklch(0.88 0.14 85), oklch(0.74 0.13 60)); color:#141414; font-family:'Geist',sans-serif; font-weight:600; font-size:15px; padding:13px 24px; border-radius:10px; cursor:pointer; box-shadow:0 8px 28px oklch(0.7 0.13 70 / .3); }\n#bkSubmit:hover { filter:brightness(1.06); }\n<\/style>\n<div id=\"bkModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"bkTitle\">\n  <div id=\"bkBackdrop\"><\/div>\n  <div id=\"bkPanel\">\n    <button id=\"bkClose\" type=\"button\" aria-label=\"Close\">✕<\/button>\n    <div id=\"bkFormWrap\">\n      <div id=\"bkTitle\" style=\"font-size:21px; font-weight:700; letter-spacing:-0.01em\">Book a demo<\/div>\n      <div style=\"font-size:14px; line-height:1.6; color:oklch(0.7 0.015 265); margin-top:6px\">Tell us where to reach you — we'll come back within a day with times.<\/div>\n      <form id=\"bkForm\">\n        <label>Name<input name=\"name\" required autocomplete=\"name\" placeholder=\"Ada Lovelace\"><\/label>\n        <label>Work email<input name=\"email\" type=\"email\" required autocomplete=\"email\" placeholder=\"you@company.com\"><\/label>\n        <label><span>Company <span style=\"font-weight:400; color:oklch(0.55 0.015 265)\">(optional)<\/span><\/span><input name=\"company\" autocomplete=\"organization\" placeholder=\"Acme Robotics\"><\/label>\n        <label><span>What are you triaging? <span style=\"font-weight:400; color:oklch(0.55 0.015 265)\">(optional)<\/span><\/span><textarea name=\"notes\" rows=\"3\" placeholder=\"e.g. automotive DLT logs, ~200 tickets/month\"><\/textarea><\/label>\n        <input type=\"checkbox\" name=\"botcheck\" style=\"display:none\" tabindex=\"-1\" autocomplete=\"off\">\n        <button id=\"bkSubmit\" type=\"submit\">Request demo<\/button>\n        <div id=\"bkHint\" style=\"font-size:12.5px; line-height:1.5; color:oklch(0.55 0.015 265)\">We'll reply within a day. No spam, ever.<\/div>\n      <\/form>\n    <\/div>\n    <div id=\"bkThanks\" style=\"display:none; text-align:center; padding:26px 6px 10px\">\n      <div style=\"width:52px; height:52px; margin:0 auto; border-radius:50%; background:oklch(0.6 0.12 155 / .15); border:1px solid oklch(0.6 0.12 155 / .4); display:flex; align-items:center; justify-content:center; font-size:22px; color:oklch(0.82 0.13 155)\">✓<\/div>\n      <div style=\"font-size:19px; font-weight:700; margin-top:16px\">Request sent<\/div>\n      <div style=\"font-size:14px; line-height:1.6; color:oklch(0.7 0.015 265); margin-top:8px\">We've got your details and will be in touch within a day.<br>Didn't go through? Write to <a href=\"mailto:jiawiehan@gmail.com\" style=\"color:oklch(0.85 0.13 85)\">jiawiehan@gmail.com<\/a>.<\/div>\n    <\/div>\n  <\/div>\n<\/div>\n<script>\n(function () {\n  var modal = document.getElementById('bkModal');\n  if (!modal) return;\n  var formWrap = document.getElementById('bkFormWrap');\n  var thanks = document.getElementById('bkThanks');\n  var form = document.getElementById('bkForm');\n  var WEB3FORMS_ACCESS_KEY = '015486fb-3bc6-4463-bd88-ab3e84e0e789';\n\n  function openModal() {\n    formWrap.style.display = '';\n    thanks.style.display = 'none';\n    modal.classList.add('bk-open');\n    document.documentElement.style.overflow = 'hidden';\n    var first = form.querySelector('input');\n    if (first) setTimeout(function () { first.focus(); }, 50);\n  }\n  function closeModal() {\n    modal.classList.remove('bk-open');\n    document.documentElement.style.overflow = '';\n  }\n\n  // Delegated: survives DC re-renders of the page tree.\n  document.addEventListener('click', function (e) {\n    var trigger = e.target.closest && e.target.closest('[data-book-demo]');\n    if (trigger) { e.preventDefault(); openModal(); }\n  });\n  document.getElementById('bkClose').addEventListener('click', closeModal);\n  document.getElementById('bkBackdrop').addEventListener('click', closeModal);\n  document.addEventListener('keydown', function (e) {\n    if (e.key === 'Escape' && modal.classList.contains('bk-open')) closeModal();\n  });\n\n  form.addEventListener('submit', function (e) {\n    e.preventDefault();\n    var d = new FormData(form);\n    var name = (d.get('name') || '').toString().trim();\n    var email = (d.get('email') || '').toString().trim();\n    var company = (d.get('company') || '').toString().trim();\n    var notes = (d.get('notes') || '').toString().trim();\n    var subject = 'Argus demo — ' + name + (company ? ' (' + company + ')' : '');\n    var mailBody = 'Hi Argus team,\\n\\nI would like to book a demo.\\n\\nName: ' + name +\n      '\\nEmail: ' + email +\n      (company ? '\\nCompany: ' + company : '') +\n      (notes ? '\\n\\nWhat we are triaging:\\n' + notes : '') + '\\n';\n    var mailtoHref = 'mailto:jiawiehan@gmail.com?subject=' +\n      encodeURIComponent(subject) + '&body=' + encodeURIComponent(mailBody);\n\n    var submitBtn = document.getElementById('bkSubmit');\n    var hint = document.getElementById('bkHint');\n    var origLabel = submitBtn.textContent;\n    submitBtn.disabled = true;\n    submitBtn.textContent = 'Sending…';\n\n    d.append('access_key', WEB3FORMS_ACCESS_KEY);\n    d.append('subject', subject);\n    d.append('from_name', name);\n    d.append('replyto', email);\n\n    fetch('https://api.web3forms.com/submit', { method: 'POST', body: d })\n      .then(function (res) { return res.json(); })\n      .then(function (data) {\n        if (!data || !data.success) throw new Error((data && data.message) || 'submit failed');\n        formWrap.style.display = 'none';\n        thanks.style.display = '';\n      })\n      .catch(function () {\n        hint.textContent = \"Couldn't send automatically — opening your mail app instead.\";\n        window.location.href = mailtoHref;\n        formWrap.style.display = 'none';\n        thanks.style.display = '';\n      })\n      .finally(function () {\n        submitBtn.disabled = false;\n        submitBtn.textContent = origLabel;\n      });\n  });\n})();\n<\/script>\n\n<\/body><\/html>"
